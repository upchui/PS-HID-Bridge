[package]
name = "ps5-hid-bridge"
description = "PS5 HID Bridge desktop application (Qt 6 / Kirigami)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ps5-hid-bridge"
path = "src/main.rs"

[dependencies]
pshb-core = { path = "../core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# D-Bus (window focus via KWin, notifications) and tray, without tokio.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[build-dependencies]
cxx-qt-build = "0.10"
