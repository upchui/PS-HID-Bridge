[workspace]
resolver = "3"
members = ["core", "ui"]
# The UI crate needs Qt (only available in the full desktop image); plain
# `cargo build/test` in the lightweight Rust image covers the core only.
default-members = ["core"]

[workspace.package]
# Not the release version: that is MAJOR.MINOR from the file VERSION plus the
# commits since it changed (tools/version.sh), passed in as PSHB_VERSION by the Makefile.
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[profile.release]
lto = "thin"
codegen-units = 4
