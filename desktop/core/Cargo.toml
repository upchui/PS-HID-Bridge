[package]
name = "pshb-core"
description = "PS5 HID Bridge core: input capture, protocol, crypto, transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "pshb_core"
path = "src/lib.rs"

[[bin]]
name = "pshb-cli"
path = "src/bin/pshb-cli.rs"

[dependencies]
chacha20poly1305 = "0.11"
clap = { version = "4.6", features = ["derive"] }
evdev = "0.13"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
serde_json = "1"
