# Builds the toolchain images and pushes them to the GitHub Container
# Registry, tagged with the content hash of versions.env and docker/
# (tools/toolchain-tag.sh). The release workflow calls this only when an image
# for the current hash is missing; building Qt from source takes hours.
#
# x86_64: all four images. aarch64 (ARM64): the desktop and AppImage test
# images, built natively on an ARM runner and tagged "<hash>-aarch64" (the
# rust image is not needed there: the desktop image has the same Rust).

name: Toolchain images

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag (output of tools/toolchain-tag.sh)
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: firmware, var: FW_IMAGE, arch: x86_64, runner: ubuntu-24.04 }
          - { image: rust, var: RUST_IMAGE, arch: x86_64, runner: ubuntu-24.04 }
          - { image: desktop, var: DESKTOP_IMAGE, arch: x86_64, runner: ubuntu-24.04 }
          - { image: apptest, var: APPTEST_IMAGE, arch: x86_64, runner: ubuntu-24.04 }
          - { image: desktop, var: DESKTOP_IMAGE, arch: aarch64, runner: ubuntu-24.04-arm }
          - { image: apptest, var: APPTEST_IMAGE, arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # earlier tags (reuse of unchanged images, below)

      # The Qt build needs about 20 GB; the runner image ships SDKs we do not use.
      - name: Free disk space
        if: matrix.image == 'desktop'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to the container registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        env:
          INPUT_TAG: ${{ inputs.tag }}
          IMAGE: ${{ matrix.image }}
          VAR: ${{ matrix.var }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag=${INPUT_TAG:-$(tools/toolchain-tag.sh)}
          suffix=""
          [ "$ARCH" = x86_64 ] || suffix="-$ARCH"
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pshb-$IMAGE"
          ref="$prefix:$tag$suffix"
          # There already (e.g. a run after another image failed): done.
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "$ref exists"
            exit 0
          fi
          # Built from the same inputs under an earlier tag: the very same
          # image, so it gets this tag too, without a rebuild or a single
          # download (all images keep one tag; tools/image-inputs.sh).
          want=$(tools/image-inputs.sh "$IMAGE" "$ARCH")
          for commit in $(git log --format=%H -n 50 -- docker versions.env); do
            [ "$(tools/image-inputs.sh "$IMAGE" "$ARCH" "$commit")" = "$want" ] || continue
            old="$prefix:$(tools/toolchain-tag.sh "$commit")$suffix"
            [ "$old" != "$ref" ] || continue
            if docker buildx imagetools inspect "$old" >/dev/null 2>&1; then
              docker buildx imagetools create --tag "$ref" "$old"
              echo "::notice::$IMAGE ($ARCH): same inputs as $old, tagged $ref without a rebuild"
              exit 0
            fi
          done
          # The source label links the package to this repository.
          make "image-$IMAGE" "$VAR=$ref" ARCH="$ARCH" QT_JOBS=4 REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          docker push "$ref"
