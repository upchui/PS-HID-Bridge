# Every commit on main: build firmware, CLI and AppImage, run every test and
# publish the result as a GitHub pre-release "v<major.minor>.<commit count>"
# (tools/version.sh), so every release has a higher version.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A push that arrives while a run is in progress waits;
# GitHub keeps only the newest waiting run.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # Releases come from main only (also when started by hand).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for toolchain images
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tools/toolchain-tag.sh)
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          build=false
          for image in firmware rust desktop apptest; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pshb-$image:$tag"
            if out=$(docker manifest inspect "$ref" 2>&1); then
              echo "found   $ref"
            elif grep -qiE "manifest unknown|not found" <<<"$out"; then
              echo "missing $ref"
              build=true
            else
              # Registry trouble is not a reason for a rebuild of several hours.
              echo "::error::$ref: $out"
              exit 1
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  toolchain:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/toolchain.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  release:
    needs: [prepare, toolchain]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.toolchain.result == 'success' || needs.toolchain.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
    env:
      # Only the cached dependencies matter; incremental data would bloat the cache.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version = commit count; release notes need the tags

      - name: Fetch submodules
        run: make submodules

      # Rust dependencies (registry and compiled crates). Saved once per
      # Cargo.lock and toolchain; our own crates are rebuilt every time.
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/target/cargo
          key: cargo-${{ needs.prepare.outputs.tag }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-${{ needs.prepare.outputs.tag }}-

      - name: Pull toolchain images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pshb"
          # In parallel; the desktop image contains the same Rust toolchain
          # as the rust image, so that one is not needed here.
          pids=()
          for image in firmware desktop apptest; do
            docker pull --quiet "$prefix-$image:$TAG" &
            pids+=($!)
          done
          for p in "${pids[@]}"; do wait "$p"; done
          {
            echo "FW_IMAGE=$prefix-firmware:$TAG"
            echo "RUST_IMAGE=$prefix-desktop:$TAG"
            echo "DESKTOP_IMAGE=$prefix-desktop:$TAG"
            echo "APPTEST_IMAGE=$prefix-apptest:$TAG"
          } >> "$GITHUB_ENV"
          df -h /

      - name: Build and test
        run: make -j2 -O PREBUILT=1 all

      - name: Collect release files
        run: |
          mkdir release
          cp out/*.uf2 out/PS-HID-Bridge-x86_64.AppImage release/
          cp out/pshb-cli release/pshb-cli-x86_64-linux
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(make -s print-release-tag)
          # GITHUB_TOKEN may not tag a commit whose workflow files differ from
          # main's (403 "Resource not accessible by integration"). That only
          # happens when a newer commit with workflow changes is on main
          # already, and its own run publishes the newer release.
          git fetch -q origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows; then
            echo "::notice::main has newer workflow files; $tag is skipped, the newer run releases"
            exit 0
          fi
          # The number repeats after a force-push or rebase: never move an
          # existing release to another commit.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged=$(git rev-list -n 1 "$tag")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists for commit $tagged (this is $GITHUB_SHA)"
              exit 1
            fi
          fi
          tools/release-notes.sh "$tag" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag exists already, replacing its files"
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --prerelease --target "$GITHUB_SHA" \
              --title "$tag" --notes-file notes.md
          fi
