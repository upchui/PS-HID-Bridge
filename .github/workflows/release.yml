# Every commit on main: build firmware, CLI and AppImage, run every test and
# publish the result as a GitHub release "v<major.minor.patch>"
# (tools/version.sh), so every release has a higher version. Releases are
# full releases (not pre-releases): the app finds the newest one through
# github.com/<repo>/releases/latest, which skips pre-releases.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A push that arrives while a run is in progress waits;
# GitHub keeps only the newest waiting run. Per branch: a run started by hand
# on another branch (it does nothing, see prepare) cannot replace main's.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # Releases come from main only (also when started by hand).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for toolchain images
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tools/toolchain-tag.sh)
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          build=false
          # x86_64: all four; aarch64 (ARM64): desktop and AppImage test.
          for image in firmware:$tag rust:$tag desktop:$tag apptest:$tag \
                       desktop:$tag-aarch64 apptest:$tag-aarch64; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pshb-$image"
            if out=$(docker manifest inspect "$ref" 2>&1); then
              echo "found   $ref"
            elif grep -qiE "manifest unknown|not found" <<<"$out"; then
              echo "missing $ref"
              build=true
            else
              # Registry trouble is not a reason for a rebuild of several hours.
              echo "::error::$ref: $out"
              exit 1
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  toolchain:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/toolchain.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  # x86_64: firmware, every test, CLI and AppImage.
  build:
    needs: [prepare, toolchain]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.toolchain.result == 'success' || needs.toolchain.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      # Only the cached dependencies matter; incremental data would bloat the cache.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version counts commits; release notes need the tags

      - name: Fetch submodules
        run: make submodules

      # Rust dependencies (registry and compiled crates). Saved once per
      # Cargo.lock and toolchain; our own crates are rebuilt every time.
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/target/cargo
          key: cargo-${{ needs.prepare.outputs.tag }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-${{ needs.prepare.outputs.tag }}-

      - name: Pull toolchain images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pshb"
          # In parallel; the desktop image contains the same Rust toolchain
          # as the rust image, so that one is not needed here.
          pids=()
          for image in firmware desktop apptest; do
            docker pull --quiet "$prefix-$image:$TAG" &
            pids+=($!)
          done
          for p in "${pids[@]}"; do wait "$p"; done
          {
            echo "FW_IMAGE=$prefix-firmware:$TAG"
            echo "RUST_IMAGE=$prefix-desktop:$TAG"
            echo "DESKTOP_IMAGE=$prefix-desktop:$TAG"
            echo "APPTEST_IMAGE=$prefix-apptest:$TAG"
          } >> "$GITHUB_ENV"
          df -h /

      - name: Build and test
        run: make -j2 -O PREBUILT=1 all

      - name: Collect release files
        run: |
          mkdir release
          cp out/*.uf2 out/PS-HID-Bridge-x86_64.AppImage release/
          cp out/pshb-cli release/pshb-cli-x86_64-linux
          # The Changelog page's data (built into the app): older apps
          # fetch it to show what a newer version brings.
          cp .cache/build/changelog-x86_64.json release/changelog.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-x86_64
          path: release/
          if-no-files-found: error
          retention-days: 3

  # aarch64 (ARM64): Rust tests, CLI and AppImage with its self-test, natively
  # on an ARM runner. The firmware is the same for every PC (built above).
  build-aarch64:
    needs: [prepare, toolchain]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.toolchain.result == 'success' || needs.toolchain.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version counts commits

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/target/cargo-aarch64
          key: cargo-aarch64-${{ needs.prepare.outputs.tag }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-aarch64-${{ needs.prepare.outputs.tag }}-

      - name: Pull toolchain images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pshb"
          pids=()
          for image in desktop apptest; do
            docker pull --quiet "$prefix-$image:$TAG-aarch64" &
            pids+=($!)
          done
          for p in "${pids[@]}"; do wait "$p"; done
          {
            echo "RUST_IMAGE=$prefix-desktop:$TAG-aarch64"
            echo "DESKTOP_IMAGE=$prefix-desktop:$TAG-aarch64"
            echo "APPTEST_IMAGE=$prefix-apptest:$TAG-aarch64"
          } >> "$GITHUB_ENV"
          df -h /

      - name: Build and test
        run: make -j2 -O ARCH=aarch64 PREBUILT=1 test-desktop desktop-cli desktop test-appimage

      - name: Collect release files
        run: |
          mkdir release
          cp out/PS-HID-Bridge-aarch64.AppImage release/
          cp out/pshb-cli-aarch64 release/pshb-cli-aarch64-linux

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-aarch64
          path: release/
          if-no-files-found: error
          retention-days: 3

  # Both builds passed: one release with every file and one SHA256SUMS.
  publish:
    needs: [prepare, build, build-aarch64]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.build-aarch64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version counts commits; release notes need the tags

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release/
          merge-multiple: true

      - name: Checksums
        run: (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(make -s print-release-tag)
          # GITHUB_TOKEN may not tag a commit whose workflow files differ from
          # main's (403 "Resource not accessible by integration"). That only
          # happens when a newer commit with workflow changes is on main
          # already, and its own run publishes the newer release.
          git fetch -q origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows; then
            echo "::notice::main has newer workflow files; $tag is skipped, the newer run releases"
            exit 0
          fi
          # The number repeats after a force-push or rebase: never move an
          # existing release to another commit.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged=$(git rev-list -n 1 "$tag")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists for commit $tagged (this is $GITHUB_SHA)"
              exit 1
            fi
          fi
          tools/release-notes.sh "$tag" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag exists already, replacing its files"
            gh release upload "$tag" release/* --clobber
          else
            # "Latest" (what the app's update check follows) only if this one is
            # newer than the current latest: a run started again for an older
            # commit must not take it back.
            current=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo v0)
            latest=false
            if [ "$(printf '%s\n%s\n' "$current" "$tag" | sort -V | tail -n1)" = "$tag" ]; then
              latest=true
            fi
            gh release create "$tag" release/* --latest="$latest" --target "$GITHUB_SHA" \
              --title "$tag" --notes-file notes.md
          fi
