# Every commit on main: build firmware, CLI and AppImage, run every test and
# publish the result as a GitHub pre-release "v<major.minor>.<commit count>"
# (tools/version.sh), so every release has a higher version.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A push that arrives while a run is in progress waits;
# GitHub keeps only the newest waiting run.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for toolchain images
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tools/toolchain-tag.sh)
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          build=false
          for image in firmware rust desktop apptest; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pshb-$image:$tag"
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "found   $ref"
            else
              echo "missing $ref"
              build=true
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  toolchain:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/toolchain.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  release:
    needs: [prepare, toolchain]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.toolchain.result == 'success' || needs.toolchain.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version = commit count; release notes need the tags

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch submodules
        run: make submodules

      - name: Pull toolchain images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pshb"
          for pair in FW_IMAGE:firmware RUST_IMAGE:rust DESKTOP_IMAGE:desktop APPTEST_IMAGE:apptest; do
            ref="$prefix-${pair#*:}:$TAG"
            docker pull --quiet "$ref"
            echo "${pair%%:*}=$ref" >> "$GITHUB_ENV"
          done

      - name: Build and test
        run: make PREBUILT=1 all

      - name: Collect release files
        run: |
          mkdir release
          cp out/*.uf2 out/PS5-HID-Bridge-x86_64.AppImage release/
          cp out/pshb-cli release/pshb-cli-x86_64-linux
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(make -s print-release-tag)
          tools/release-notes.sh "$tag" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag exists already, replacing its files"
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --prerelease --target "$GITHUB_SHA" \
              --title "$tag" --notes-file notes.md
          fi
